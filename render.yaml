# Free demo. Local SQLite data is ephemeral and can disappear on restart.
services:
  - type: web
    name: finn-investment-research
    runtime: python
    repo: https://github.com/Glenap/Enam_competition
    branch: main
    plan: free
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FINN_DATA_DIR
        value: /tmp/finn-data
      - key: FINN_REQUIRE_AUTH
        value: "1"
      - key: FINN_DEMO_PASSWORD
        generateValue: true
